database:
  path: "./data/steamdt.db"

catalog:
  sync_ttl_hours: 24

collector:
  batch_size: 50
  max_chunks_per_run: 1

watchlist:
  - market_hash_name: "AK-47 | Cartel (Minimal Wear)"
    enabled: false

  - market_hash_name: "USP-S | Road Rash (Factory New)"
    enabled: false

  - market_hash_name: "AWP | Atheris (Field-Tested)"
    enabled: false

universe:
  include_skins: true
  include_agents: true
  include_stickers: false
  include_stattrak: false
  include_souvenir: false

  require_platforms:
    - "BUFF"
    - "YOUPIN"
    - "C5"
    - "HALOSKINS"
    - "STEAM"

  exclude_patterns:
    - "Graffiti"
    - "Patch"
    - "Music Kit"
    - "Case"
    - "Capsule"
    - "Souvenir Package"
    - "Service Medal"
    - "Coin"
    - "Star for Operation"
    - "Stars for Operation"
    - "Pass"
    - "Name Tag"
    - "Swap Tool"
    - "Key"