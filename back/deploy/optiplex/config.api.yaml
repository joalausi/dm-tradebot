poll_every: "5m"

discord:
  mention: ""

account_targets:
  enabled: true
  game_ids:
    - "a8db"
  statuses:
    - "TargetStatusActive"
    - "TargetStatusInactive"
  default_top_n: 5

dmarket_crawler:
  enabled: true
  poll_every: "10m"
  game_id: "a8db"
  currency: "USD"

  price_from_usd: 5
  price_to_usd: 500
  limit: 100
  max_pages: 20

  min_profit_usd: 1
  min_roi_percent: 3
  last_sales_limit: 10
  min_last_sales_count: 3

  steamdt_filter:
    enabled: true
    database_path: "/var/lib/targetbot/steamdt.db"
    max_snapshot_age: "36h"
    anomaly_lookback: "24h"
    min_platforms: 3
    min_total_sell_count: 20
    min_total_bid_count: 10
    allow_outside_universe: false
    allow_missing_snapshots: false
