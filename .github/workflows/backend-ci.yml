name: Backend CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'back/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'back/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: back/go.mod
          cache-dependency-path: back/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build dmarket-target-bot
        run: go build ./cmd/dmarket-target-bot

      - name: Build steamdt-crawler
        run: go build ./cmd/steamdt-crawler

      - name: Check OptiPlex worker script
        run: sh -n deploy/optiplex/steamdt-worker.sh
